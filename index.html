<!DOCTYPE html>
<html>
<head>
  <title>Hw3</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dat.gui/build/dat.gui.min.js"></script>

  <script>
    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xede7f6);

    // Camera
    const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
    camera.position.set(0, 2, 5);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // Lights
    const frontLight = new THREE.DirectionalLight(0xffffff, 2.0);
    frontLight.position.set(5, 8, 5);
    frontLight.castShadow = true;
    scene.add(frontLight);

    const ambient = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambient);

    // Ground Plane
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x777777,
      roughness: 0.8,
      metalness: 0.2
    });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Extra PBR Objects
    const sphereMat = new THREE.MeshStandardMaterial({ color: 0xff4444, metalness: 0.9, roughness: 0.2 });
    const boxMat = new THREE.MeshStandardMaterial({ color: 0x4444ff, metalness: 0.3, roughness: 0.7 });

    const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), sphereMat);
    sphere.position.set(-2, 0.5, 0);
    sphere.castShadow = true;
    scene.add(sphere);

    const box = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), boxMat);
    box.position.set(2, 0.5, 0);
    box.castShadow = true;
    scene.add(box);

    // OBJ Model
    const texLoader = new THREE.TextureLoader();
    const textures = {
      body_diff: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/body_diff.png"),
      body_norm: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/body_norm.png"),
      body_gloss: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/body_gloss.png"),
      body_spec: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/body_spec.png"),
      body_AO: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/body_AO.png"),
      head_diff: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/head_diff.png"),
      head_norm: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/head_norm.png"),
      head_gloss: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/head_gloss.png"),
      head_spec: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/head_spec.png"),
      head_AO: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/head_AO.png")
    };

    const loader = new THREE.OBJLoader();
    loader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/metal.obj", (object) => {
      object.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          child.material = new THREE.MeshStandardMaterial({
            map: textures.body_diff,
            normalMap: textures.body_norm,
            metalnessMap: textures.body_spec,
            roughnessMap: textures.body_gloss,
            aoMap: textures.body_AO,
            metalness: 0.9,
            roughness: 0.3
          });
        }
      });
      object.position.y = 0;
      scene.add(object);
    });

    // dat.GUI
    const gui = new dat.GUI();
    const lightFolder = gui.addFolder("Light Position");
    lightFolder.add(frontLight.position, "x", -10, 10);
    lightFolder.add(frontLight.position, "y", 0, 15);
    lightFolder.add(frontLight.position, "z", -10, 10);
    lightFolder.open();

    const sphereFolder = gui.addFolder("Sphere Material");
    sphereFolder.add(sphere.material, "metalness", 0, 1);
    sphereFolder.add(sphere.material, "roughness", 0, 1);
    sphereFolder.open();

    const boxFolder = gui.addFolder("Box Material");
    boxFolder.add(box.material, "metalness", 0, 1);
    boxFolder.add(box.material, "roughness", 0, 1);
    boxFolder.open();

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener("resize", () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
