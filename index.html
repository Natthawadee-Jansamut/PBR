<!DOCTYPE html>
<html>
<head>
  <title>Hw3</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dat.gui/build/dat.gui.min.js"></script>

  <script>
    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xede7f6);

    // Camera
    const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
    camera.position.set(0, 2, 5);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // Lights
    const frontLight = new THREE.DirectionalLight(0xffffff, 2.0);
    frontLight.position.set(5, 8, 5);
    frontLight.castShadow = true;
    scene.add(frontLight);

    const ambient = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambient);

    // Texture Loader
    const texLoader = new THREE.TextureLoader();

    // ✅ Ground with texture
    const groundTex = texLoader.load("https://threejs.org/examples/textures/terrain/grasslight-big.jpg");
    groundTex.wrapS = THREE.RepeatWrapping;
    groundTex.wrapT = THREE.RepeatWrapping;
    groundTex.repeat.set(10, 10); // ทำให้ลายหญ้าซ้ำๆ ดูเป็นพื้นกว้าง

    const groundMat = new THREE.MeshStandardMaterial({
      map: groundTex,
      roughness: 0.9,
      metalness: 0.0
    });

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Extra PBR Sphere
    const sphereMat = new THREE.MeshStandardMaterial({ color: 0xff4444, metalness: 0.9, roughness: 0.2 });
    const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), sphereMat);
    sphere.position.set(-2, 0.5, 0);
    sphere.castShadow = true;
    scene.add(sphere);

    // EnvMap (reflection)
    const cubeUrls = [
      'https://threejs.org/examples/textures/cube/Bridge2/posx.jpg',
      'https://threejs.org/examples/textures/cube/Bridge2/negx.jpg',
      'https://threejs.org/examples/textures/cube/Bridge2/posy.jpg',
      'https://threejs.org/examples/textures/cube/Bridge2/negy.jpg',
      'https://threejs.org/examples/textures/cube/Bridge2/posz.jpg',
      'https://threejs.org/examples/textures/cube/Bridge2/negz.jpg'
    ];
    const envMap = new THREE.CubeTextureLoader().load(cubeUrls);
    envMap.encoding = THREE.sRGBEncoding;
    scene.environment = envMap;

    // Model Textures
    const textures = {
      body_diff: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/body_diff.png"),
      body_norm: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/body_norm.png"),
      body_gloss: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/body_gloss.png"),
      body_spec: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/body_spec.png"),
      body_AO: texLoader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/body_AO.png")
    };

    // OBJ Model
    // OBJ Model
let modelMaterial;
const loader = new THREE.OBJLoader();
loader.load("https://raw.githubusercontent.com/Natthawadee-Jansamut/PBR/main/metal.obj", (object) => {
  object.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;

      switch (child.name) {
        case "Object_6": // แขน
          child.material = new THREE.MeshStandardMaterial({
            map: textures.hands_diff,
            normalMap: textures.hands_norm,
            metalnessMap: textures.hands_spec,
            roughnessMap: textures.hands_gloss,
            aoMap: textures.body_AO,
            envMap: envMap,
            metalness: 3.0,
            roughness: 0.1
          });
          break;

        case "Object_7": // หัว
          child.material = new THREE.MeshStandardMaterial({
            map: textures.head_diff,
            normalMap: textures.head_norm,
            metalnessMap: textures.head_spec,
            roughnessMap: textures.head_gloss,
            aoMap: textures.head_AO,
            envMap: envMap,
            metalness: 3.0,
            roughness: 0.1
          });
          break;

        case "Object_8": // ตา
          child.material = new THREE.MeshStandardMaterial({
            map: textures.eye_diff,
            envMap: envMap,
            metalness: 0.2,
            roughness: 1.0
          });
          break;

        case "Object_9": // ขา
          child.material = new THREE.MeshStandardMaterial({
            map: textures.legs_diff,
            normalMap: textures.legs_norm,
            metalnessMap: textures.legs_spec,
            roughnessMap: textures.legs_gloss,
            aoMap: textures.legs_AO,
            envMap: envMap,
            metalness: 3.0,
            roughness: 0.1
          });
          break;

        case "Object_10": // ตัว
          child.material = new THREE.MeshStandardMaterial({
            map: textures.body_diff,
            normalMap: textures.body_norm,
            metalnessMap: textures.body_spec,
            roughnessMap: textures.body_gloss,
            aoMap: textures.body_AO,
            envMap: envMap,
            metalness: 1.0,
            roughness: 0.25
          });
          break;

        case "Object_12": // Jetpack
          child.material = new THREE.MeshStandardMaterial({
            map: textures.jetpack_diff,
            normalMap: textures.jetpack_norm,
            metalnessMap: textures.jetpack_spec,
            roughnessMap: textures.jetpack_gloss,
            aoMap: textures.jetpack_AO,
            envMap: envMap,
            metalness: 3.0,
            roughness: 0.05
          });
          break;

        default: // อื่น ๆ
          child.material = new THREE.MeshStandardMaterial({
            color: 0xaaaaaa,
            envMap: envMap,
            metalness: 0.8,
            roughness: 0.3
          });
      }
    }
  });
  object.position.y = 0;
  scene.add(object);
});

    // dat.GUI
    const gui = new dat.GUI();
    const lightFolder = gui.addFolder("Light Position");
    lightFolder.add(frontLight.position, "x", -10, 10);
    lightFolder.add(frontLight.position, "y", 0, 15);
    lightFolder.add(frontLight.position, "z", -10, 10);
    lightFolder.open();

    const sphereFolder = gui.addFolder("Sphere Material");
    sphereFolder.add(sphere.material, "metalness", 0, 1);
    sphereFolder.add(sphere.material, "roughness", 0, 1);
    sphereFolder.open();

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener("resize", () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
